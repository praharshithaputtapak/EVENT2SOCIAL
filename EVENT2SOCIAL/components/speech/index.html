<!doctype html><html><head><meta charset="utf-8"><style>body{font:14px Arial;color:#27313b;margin:4px}button{padding:8px 12px;border:1px solid #8091a1;border-radius:6px;background:white;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}#status{margin-left:8px;color:#526273}</style></head><body><button id="mic">🎙 Start voice input</button><span id="status">Start recording only if you accept your browser’s speech processing. Audio is not sent to EVENT2SOCIAL; your browser may use its own speech service.</span><script>
let value=''; const btn=document.getElementById('mic'), status=document.getElementById('status'); const SR=window.SpeechRecognition||window.webkitSpeechRecognition; const secure=window.isSecureContext||location.hostname==='localhost'||location.hostname==='127.0.0.1';
function send(v){value=v;parent.postMessage({isStreamlitMessage:true,type:'streamlit:setComponentValue',value:v},'*')}
parent.postMessage({isStreamlitMessage:true,type:'streamlit:componentReady',apiVersion:1},'*'); parent.postMessage({isStreamlitMessage:true,type:'streamlit:setFrameHeight',height:70},'*');
if(!secure){btn.disabled=true;status.textContent='Voice input requires HTTPS for this network address. Use manual text entry or open the app over trusted HTTPS.'} else if(!SR){btn.disabled=true;status.textContent='Voice input is not supported in this browser. Please type your text.'} else {let rec=new SR(); rec.lang=navigator.language||'en-US';rec.interimResults=true;rec.continuous=false;rec.onresult=e=>{let t='';for(let i=e.resultIndex;i<e.results.length;i++)t+=e.results[i][0].transcript;send(t)};rec.onerror=e=>status.textContent=e.error==='not-allowed'?'Microphone permission denied. Please type your text.':'Could not record. Please try again or type your text.';rec.onend=()=>{btn.textContent='🎙 Start voice input';if(value)status.textContent='Transcription ready to edit.'};btn.onclick=()=>{if(btn.dataset.active){rec.stop();btn.dataset.active='';}else{try{rec.start();btn.dataset.active='1';btn.textContent='■ Stop recording';status.textContent='Listening…'}catch(e){status.textContent='Microphone could not start. Please type your text.'}}}}
</script></body></html>
