[theme]
base = "light"
primaryColor = "#3263E8"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F1EF"
textColor = "#171A20"
font = "sans serif"

[server]
headless = true
port = 8509

address = "0.0.0.0"
sslCertFile = ".streamlit/certs/server-cert.pem"
sslKeyFile = ".streamlit/certs/server-key.pem"
